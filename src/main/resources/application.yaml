server:
  port: 8082
spring:
  application:
    name: postgres-demo
  datasource:
    url: jdbc:postgresql://x:5432/db?currentSchema=public&stringtype=unspecified
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
mybatis:
  mapper-locations: classpath:mapper/*Mapper.xml  # XML 映射文件路径
  type-aliases-package: com.example.model   # 实体类别名包
  config-location: classpath:sql-mapper-config.xml

logging:
  level:
    com.example.mapper: DEBUG